<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="icon" type="image/png" href="../img/1kIcon.png">
    <title>Vocabulary - MinkerPage</title>
    
    <style>
        /* Vocabulary App Styles - Inline */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translate(-50%, -60%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
        html, body { margin: 0; padding: 0; color: white; width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        .main-home-link {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 1100;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(20, 20, 20, 0.45);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .main-home-link:hover {
            color: #ffffff;
            border-color: rgba(6, 80, 241, 0.9);
            box-shadow: 0 0 0 3px rgba(6, 80, 241, 0.18);
        }
        .vocab-container { padding: 40px 20px 60px; min-height: 100vh; width: 100%; max-width: 100%; margin: 0; display: block; }
        .container-md { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 15px; }
        .view-section { animation: fadeIn 0.3s ease-in; }
        .vocab-btn { background: linear-gradient(135deg, #0650f1, #0550d9); border: none; color: white; font-weight: 600; transition: all 0.3s ease; border-radius: 8px; }
        .vocab-btn:hover { background: linear-gradient(135deg, #0550d9, #0440b0); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(6, 80, 241, 0.3); color: white; }
        .vocab-btn.btn-secondary { background: linear-gradient(135deg, #6c757d, #5a6268); }
        .vocab-btn.btn-secondary:hover { background: linear-gradient(135deg, #5a6268, #495057); color: white; }
        .vocab-btn.btn-success { background: linear-gradient(135deg, #28a745, #20c997); }
        .vocab-btn.btn-success:hover { background: linear-gradient(135deg, #20c997, #17a2b8); color: white; }
        .vocab-btn.btn-danger { background: linear-gradient(135deg, #ef0326, #c40222); }
        .vocab-btn.btn-danger:hover { background: linear-gradient(135deg, #c40222, #9a011a); color: white; }
        .vocab-btn.btn-outline-primary { border: 2px solid #0650f1; color: #0650f1; background: transparent; }
        .vocab-btn.btn-outline-primary:hover { background: #0650f1; color: white; }
        .vocab-input { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 8px; transition: all 0.3s ease; }
        .vocab-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .vocab-input:focus { background-color: rgba(255, 255, 255, 0.08); border-color: #0650f1; color: white; box-shadow: 0 0 0 0.2rem rgba(6, 80, 241, 0.25); }
        .form-control { background-color: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; border-radius: 8px; transition: all 0.3s ease; }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.4) !important; }
        .form-control:focus { background-color: rgba(255, 255, 255, 0.08) !important; border-color: #0650f1 !important; color: white !important; box-shadow: 0 0 0 0.2rem rgba(6, 80, 241, 0.25) !important; }
        textarea.form-control { background-color: rgba(255, 255, 255, 0.05) !important; color: white !important; }
        .set-card { background: linear-gradient(135deg, rgba(6, 80, 241, 0.1), rgba(186, 6, 241, 0.1)); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; }
        .set-card::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent); transition: left 0.5s ease; z-index: 1; }
        .set-card:hover { transform: translateY(-4px); border-color: #0650f1; box-shadow: 0 8px 24px rgba(6, 80, 241, 0.2); }
        .set-card:hover::before { left: 100%; }
        .set-card-title { color: #ffffff; font-weight: 700; font-size: 18px; margin-bottom: 8px; }
        .set-card-description { color: rgba(255, 255, 255, 0.7); font-size: 14px; margin-bottom: 12px; line-height: 1.4; }
        .set-card-stats { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: rgba(255, 255, 255, 0.6); }
        .set-card-actions { position: absolute; bottom: 10px; right: 10px; opacity: 0; transition: opacity 0.3s ease; }
        .set-card:hover .set-card-actions { opacity: 1; }
        .term-input-group { background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 15px; margin-bottom: 12px; transition: all 0.3s ease; }
        .term-input-group:hover { border-color: rgba(6, 80, 241, 0.3); background-color: rgba(255, 255, 255, 0.05); }
        .term-input-group.term-pair { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
        .term-label { color: rgba(255, 255, 255, 0.6); font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
        .sets-header { text-align: center; }
        .sets-actions { justify-content: center; }
        .btn-icon { width: 18px; height: 18px; vertical-align: text-bottom; margin-right: 6px; }
        .study-mode-btn { background: linear-gradient(135deg, rgba(6, 80, 241, 0.1), rgba(186, 6, 241, 0.1)); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 12px; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 600; min-height: 120px; }
        .study-mode-btn:hover { background: linear-gradient(135deg, rgba(6, 80, 241, 0.2), rgba(186, 6, 241, 0.2)); border-color: #0650f1; color: white; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(6, 80, 241, 0.2); }
        .study-mode-btn svg { width: 36px; height: 36px; }
        .flashcard { background: linear-gradient(135deg, rgba(6, 80, 241, 0.1), rgba(186, 6, 241, 0.1)); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 60px 40px; min-height: 300px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; margin: 40px auto; perspective: 1000px; transition: all 0.6s ease; text-align: center; }
        .flashcard:hover { border-color: #0650f1; box-shadow: 0 12px 40px rgba(6, 80, 241, 0.25); }
        .flashcard.flipped { background: linear-gradient(135deg, rgba(255, 174, 0, 0.1), rgba(239, 3, 38, 0.1)); border-color: rgba(255, 174, 0, 0.3); }
        .flashcard.flipping { animation: flashFlip 0.45s ease; }
        @keyframes flashFlip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        .flashcard-content { font-size: 36px; font-weight: 700; color: white; word-wrap: break-word; line-height: 1.4; }
        .flashcard-hint { position: absolute; top: 15px; right: 15px; font-size: 12px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; font-weight: 600; }
        .flashcard-counter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        .flashcard-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .choice-option { background-color: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease; color: white; font-weight: 500; }
        .choice-option:hover { border-color: #0650f1; background-color: rgba(6, 80, 241, 0.1); }
        .choice-option.selected { border-color: #0650f1; background-color: rgba(6, 80, 241, 0.2); }
        .choice-option.correct { border-color: #28a745; background-color: rgba(40, 167, 69, 0.2); }
        .choice-option.incorrect { border-color: #ef0326; background-color: rgba(239, 3, 38, 0.2); }
        .choice-option.disabled { opacity: 0.6; cursor: not-allowed; }
        .answer-feedback { margin-top: 16px; border-radius: 8px; padding: 12px 14px; font-weight: 600; }
        .answer-feedback.correct { background-color: rgba(40, 167, 69, 0.2); border: 1px solid rgba(40, 167, 69, 0.8); color: #8af0a8; }
        .answer-feedback.incorrect { background-color: rgba(239, 3, 38, 0.2); border: 1px solid rgba(239, 3, 38, 0.8); color: #ff9aa7; }
        .correct-answer { margin-top: 6px; color: rgba(255, 255, 255, 0.9); font-weight: 500; }
        .typing-container { background-color: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 30px; margin: 20px 0; }
        .typing-input { background-color: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; font-size: 18px; padding: 12px 15px; margin-bottom: 15px; font-weight: 500; }
        .typing-input:focus { border-color: #0650f1; box-shadow: 0 0 0 0.2rem rgba(6, 80, 241, 0.25); }
        .vocab-progress { background-color: rgba(255, 255, 255, 0.08); border-radius: 8px; overflow: hidden; height: 8px; margin: 15px 0; }
        .vocab-progress-bar { background: linear-gradient(90deg, #0650f1, #ba06f1); height: 100%; transition: width 0.3s ease; }
        .learning-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-value { color: #0650f1; font-size: 24px; font-weight: 700; }
        .stat-label { color: rgba(255, 255, 255, 0.6); font-size: 12px; margin-top: 5px; text-transform: uppercase; }
        .custom-alert-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 9998; display: none; }
        .custom-alert-overlay.show { display: block; }
        .custom-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(43, 43, 64, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 30px; max-width: 400px; z-index: 9999; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); animation: slideIn 0.3s ease; display: none; }
        .custom-alert-title { color: #0650f1; font-weight: 700; font-size: 20px; margin-bottom: 15px; }
        .custom-alert-message { color: rgba(255, 255, 255, 0.8); font-size: 16px; margin-bottom: 20px; line-height: 1.5; }
        .custom-alert-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .custom-alert-btn { padding: 8px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .custom-alert-btn-primary { background: linear-gradient(135deg, #0650f1, #0550d9); color: white; }
        .custom-alert-btn-primary:hover { background: linear-gradient(135deg, #0550d9, #0440b0); transform: translateY(-2px); }
        .custom-alert-btn-secondary { background: rgba(255, 255, 255, 0.1); color: white; }
        .custom-alert-btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .results-container { text-align: center; padding: 40px 20px; }
        .results-score { font-size: 64px; font-weight: 700; background: linear-gradient(135deg, #0650f1, #ba06f1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; }
        .results-title { color: white; font-size: 28px; margin-bottom: 30px; }
        .results-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .result-item { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 20px; }
        .result-item-number { font-size: 32px; font-weight: 700; color: #0650f1; margin-bottom: 8px; }
        .result-item-label { color: rgba(255, 255, 255, 0.7); font-size: 14px; }
        @keyframes slideIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease; }
        @media (max-width: 768px) { .term-input-group.term-pair { grid-template-columns: 1fr; } .flashcard { padding: 40px 20px; min-height: 250px; } .flashcard-content { font-size: 24px; } .study-mode-btn { min-height: 100px; } .results-score { font-size: 48px; } .vocab-container { padding: 20px 10px 60px; } }
    </style>
</head>

    <div class="custom-alert-overlay" id="alertOverlay"></div>
    <div class="custom-alert" id="alertModal">
        <div class="custom-alert-title" id="alertTitle"></div>
        <div class="custom-alert-message" id="alertMessage"></div>
        <input type="text" class="form-control" id="alertInput" style="display: none; margin-bottom: 16px;" />
        <div class="custom-alert-buttons" id="alertButtons"></div>
    </div>

    <script>
        // Vocabulary App - Complete JavaScript Implementation

        let app = null;

        class VocabularyApp {
            constructor() {
                this.vocabSets = this.loadFromLocalStorage() || [];
                this.currentSet = null;
                this.currentIndex = 0;
                this.currentMode = null;
                this.studyResults = { correct: 0, incorrect: 0, skipped: 0 };
                this.init();
            }

            init() {
                this.renderSetsList();
            }

            // CUSTOM ALERT SYSTEM
            showAlert(title, message, buttons = []) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('alertOverlay');
                    const modal = document.getElementById('alertModal');
                    const titleEl = document.getElementById('alertTitle');
                    const messageEl = document.getElementById('alertMessage');
                    const inputEl = document.getElementById('alertInput');
                    const buttonsContainer = document.getElementById('alertButtons');

                    titleEl.textContent = title;
                    messageEl.textContent = message;
                    inputEl.style.display = 'none';
                    inputEl.value = '';
                    buttonsContainer.innerHTML = '';

                    if (buttons.length === 0) {
                        buttons = ['OK'];
                    }

                    buttons.forEach((label, index) => {
                        const btn = document.createElement('button');
                        btn.className = `custom-alert-btn ${index === 0 ? 'custom-alert-btn-primary' : 'custom-alert-btn-secondary'}`;
                        btn.textContent = label;
                        btn.onclick = () => {
                            this.closeAlert();
                            resolve(index);
                        };
                        buttonsContainer.appendChild(btn);
                    });

                    overlay.classList.add('show');
                    modal.style.display = 'block';
                });
            }

            showPrompt(title, message, placeholder = '', defaultValue = '') {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('alertOverlay');
                    const modal = document.getElementById('alertModal');
                    const titleEl = document.getElementById('alertTitle');
                    const messageEl = document.getElementById('alertMessage');
                    const inputEl = document.getElementById('alertInput');
                    const buttonsContainer = document.getElementById('alertButtons');

                    titleEl.textContent = title;
                    messageEl.textContent = message;
                    inputEl.style.display = 'block';
                    inputEl.placeholder = placeholder;
                    inputEl.value = defaultValue;
                    buttonsContainer.innerHTML = '';

                    const createBtn = (label, primary, onClick) => {
                        const btn = document.createElement('button');
                        btn.className = `custom-alert-btn ${primary ? 'custom-alert-btn-primary' : 'custom-alert-btn-secondary'}`;
                        btn.textContent = label;
                        btn.onclick = onClick;
                        return btn;
                    };

                    const cancelBtn = createBtn('Cancel', false, () => {
                        this.closeAlert();
                        resolve(null);
                    });

                    const createBtnConfirm = createBtn('Create', true, () => {
                        const value = inputEl.value.trim();
                        this.closeAlert();
                        resolve(value.length > 0 ? value : null);
                    });

                    buttonsContainer.appendChild(cancelBtn);
                    buttonsContainer.appendChild(createBtnConfirm);

                    inputEl.onkeydown = (event) => {
                        if (event.key === 'Enter') {
                            createBtnConfirm.click();
                        }
                    };

                    overlay.classList.add('show');
                    modal.style.display = 'block';
                    setTimeout(() => inputEl.focus(), 0);
                });
            }

            showConfirm(title, message) {
                return this.showAlert(title, message, ['Yes', 'No']).then(result => result === 0);
            }

            closeAlert() {
                const overlay = document.getElementById('alertOverlay');
                const modal = document.getElementById('alertModal');
                overlay.classList.remove('show');
                modal.style.display = 'none';
            }

            // STORAGE
            loadFromLocalStorage() {
                const data = localStorage.getItem('vocabSets');
                return data ? JSON.parse(data) : null;
            }

            saveToLocalStorage() {
                localStorage.setItem('vocabSets', JSON.stringify(this.vocabSets));
            }

            // VIEW MANAGEMENT
            switchView(view) {
                document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
                if (view === 'setsList') {
                    document.getElementById('setsListView').style.display = 'block';
                    this.renderSetsList();
                } else if (view === 'editor') {
                    document.getElementById('setEditorView').style.display = 'block';
                    this.renderSetEditor();
                } else if (view === 'study') {
                    document.getElementById('studyModeView').style.display = 'block';
                }
            }

            // SETS MANAGEMENT
            showCreateSetForm() {
                this.showPrompt('Create Set', 'Enter a title for your new set:', 'Set title').then(setName => {
                    if (!setName) {
                        return;
                    }
                    this.currentSet = {
                        id: Date.now(),
                        name: setName,
                        description: '',
                        terms: [],
                        stats: { studied: 0, accuracy: 0 }
                    };
                    this.switchView('editor');
                });
            }

            saveCurrentSet() {
                const title = document.getElementById('setTitle').value.trim();
                if (!title) {
                    this.showAlert('Error', 'Set title cannot be empty!');
                    return;
                }

                this.currentSet.name = title;
                this.currentSet.description = document.getElementById('setDescription').value;

                const termInputs = document.querySelectorAll('.term-pair');
                this.currentSet.terms = [];

                termInputs.forEach(group => {
                    const termInput = group.querySelector('[data-type="term"]');
                    const defInput = group.querySelector('[data-type="definition"]');
                    if (termInput.value.trim() && defInput.value.trim()) {
                        this.currentSet.terms.push({
                            id: Date.now() + Math.random(),
                            term: termInput.value.trim(),
                            definition: defInput.value.trim()
                        });
                    }
                });

                if (this.currentSet.terms.length === 0) {
                    this.showAlert('Error', 'Please add at least one term!');
                    return;
                }

                const existingIndex = this.vocabSets.findIndex(set => set.id === this.currentSet.id);
                if (existingIndex >= 0) {
                    this.vocabSets[existingIndex] = this.currentSet;
                } else {
                    this.vocabSets.push(this.currentSet);
                }

                this.saveToLocalStorage();
                this.showAlert('Success', 'Set saved successfully!', ['OK']).then(() => {
                    this.switchView('setsList');
                });
            }

            deleteSet(setId) {
                this.showConfirm('Delete Set', 'Are you sure you want to delete this set?').then(confirmed => {
                    if (confirmed) {
                        this.vocabSets = this.vocabSets.filter(set => set.id !== setId);
                        this.saveToLocalStorage();
                        this.renderSetsList();
                    }
                });
            }

            renderSetsList() {
                const setsList = document.getElementById('setsList');
                const emptyMessage = document.getElementById('emptyMessage');

                setsList.innerHTML = '';

                if (this.vocabSets.length === 0) {
                    emptyMessage.style.display = 'block';
                    setsList.style.display = 'none';
                    return;
                }

                emptyMessage.style.display = 'none';
                setsList.style.display = 'grid';

                this.vocabSets.forEach(set => {
                    const card = document.createElement('div');
                    card.className = 'col-md-6 col-lg-4';
                    card.innerHTML = `
                        <div class="set-card" onclick="app.openSet(${set.id})">
                            <div class="set-card-title">${this.escapeHtml(set.name)}</div>
                            <div class="set-card-description">${this.escapeHtml(set.description || 'No description')}</div>
                            <div class="set-card-stats">
                                <span>${set.terms.length} terms</span>
                                <span>${set.stats.accuracy}% accuracy</span>
                            </div>
                            <div class="set-card-actions">
                                <button class="btn vocab-btn btn-sm" onclick="event.stopPropagation(); app.editSet(${set.id})">Edit</button>
                                <button class="btn vocab-btn btn-sm btn-danger" onclick="event.stopPropagation(); app.deleteSet(${set.id})">Delete</button>
                            </div>
                        </div>
                    `;
                    setsList.appendChild(card);
                });
            }

            openSet(setId) {
                this.currentSet = this.vocabSets.find(set => set.id === setId);
                if (this.currentSet) {
                    const nextView = this.currentSet.terms.length === 0 ? 'editor' : 'study';
                    this.switchView(nextView);
                    if (nextView === 'study') {
                        document.getElementById('studySetTitle').textContent = this.currentSet.name;
                        this.renderStudyModeSelection();
                    }
                }
            }

            editSet(setId) {
                this.currentSet = this.vocabSets.find(set => set.id === setId);
                if (!this.currentSet) {
                    return;
                }
                this.switchView('editor');
            }

            renderSetEditor() {
                document.getElementById('setTitle').value = this.currentSet.name;
                document.getElementById('setDescription').value = this.currentSet.description || '';
                this.renderTermsEditor();
            }

            renderTermsEditor() {
                const container = document.getElementById('termsContainer');
                container.innerHTML = '';

                this.currentSet.terms.forEach((term, index) => {
                    const group = document.createElement('div');
                    group.className = 'term-input-group term-pair';
                    group.innerHTML = `
                        <div>
                            <label class="term-label">Term ${index + 1}</label>
                            <input type="text" class="term-input form-control" data-type="term" value="${this.escapeHtml(term.term)}" placeholder="Enter term">
                        </div>
                        <div>
                            <label class="term-label">Definition</label>
                            <input type="text" class="term-input form-control" data-type="definition" value="${this.escapeHtml(term.definition)}" placeholder="Enter definition">
                        </div>
                        <button class="btn vocab-btn btn-danger btn-sm" onclick="app.removeTerm(${index})" style="height: fit-content;">Remove</button>
                    `;
                    container.appendChild(group);
                });
            }

            addNewTerm() {
                // Save current form data to preserve existing terms
                const termInputs = document.querySelectorAll('.term-pair');
                const savedTerms = [];
                termInputs.forEach(group => {
                    const termInput = group.querySelector('[data-type="term"]');
                    const defInput = group.querySelector('[data-type="definition"]');
                    if (termInput && defInput) {
                        savedTerms.push({
                            term: termInput.value,
                            definition: defInput.value
                        });
                    }
                });

                // Update current set with saved data
                this.currentSet.terms = savedTerms.map((t, idx) => ({
                    id: this.currentSet.terms[idx]?.id || Date.now() + Math.random(),
                    term: t.term,
                    definition: t.definition
                }));

                // Add new empty term
                this.currentSet.terms.push({ id: Date.now() + Math.random(), term: '', definition: '' });
                this.renderTermsEditor();
                setTimeout(() => {
                    const allTermInputs = document.querySelectorAll('[data-type="term"]');
                    if (allTermInputs.length > 0) {
                        allTermInputs[allTermInputs.length - 1].focus();
                    }
                }, 0);
            }

            removeTerm(index) {
                this.currentSet.terms.splice(index, 1);
                this.renderTermsEditor();
            }

            // STUDY MODE
            renderStudyModeSelection() {
                document.getElementById('modeSelectionView').style.display = 'block';
                document.getElementById('studyContentView').style.display = 'none';
                document.getElementById('resultsView').style.display = 'none';
            }

            startStudySession(mode) {
                if (this.currentSet.terms.length < 2) {
                    this.showAlert('Error', 'You need at least 2 terms to study!');
                    return;
                }

                this.currentMode = mode;
                this.currentIndex = 0;
                this.isFlipping = false;
                this.studyResults = { correct: 0, incorrect: 0, skipped: 0 };

                document.getElementById('modeSelectionView').style.display = 'none';
                document.getElementById('studyContentView').style.display = 'block';
                document.getElementById('resultsView').style.display = 'none';

                this.renderStudyContent();
            }

            renderStudyContent() {
                const studyContent = document.getElementById('studyContent');
                const currentTerm = this.currentSet.terms[this.currentIndex];

                this.updateProgressBar();

                if (this.currentMode === 'flashcard') {
                    studyContent.innerHTML = `
                        <div class="flashcard" onclick="app.toggleFlashcard()">
                            <div class="flashcard-hint" id="flipHint">Click to reveal</div>
                            <div class="flashcard-content" id="flashcardContent">${this.escapeHtml(currentTerm.term)}</div>
                            <div class="flashcard-counter">${this.currentIndex + 1} / ${this.currentSet.terms.length}</div>
                        </div>
                        <div class="flashcard-buttons">
                            <button class="btn vocab-btn btn-danger" onclick="app.submitFlashcardAnswer('incorrect')">Incorrect</button>
                            <button class="btn vocab-btn" onclick="app.submitFlashcardAnswer('skip')">Skip</button>
                            <button class="btn vocab-btn btn-success" onclick="app.submitFlashcardAnswer('correct')">Correct</button>
                        </div>
                    `;
                    this.flashcardFlipped = false;
                } else if (this.currentMode === 'multichoice') {
                    const options = this.generateMultipleChoiceOptions(currentTerm);
                    let choicesHtml = '';
                    options.forEach((option, idx) => {
                        choicesHtml += `<div class="choice-option" data-index="${idx}" onclick="app.submitMultipleChoice(${idx}, ${option.correct})">${this.escapeHtml(option.text)}</div>`;
                    });
                    studyContent.innerHTML = `
                        <div style="margin-bottom: 30px;">
                            <h4 class="w-txt mb-4">${this.escapeHtml(currentTerm.term)}</h4>
                            ${choicesHtml}
                            <div id="studyFeedback"></div>
                        </div>
                    `;
                } else if (this.currentMode === 'typing') {
                    studyContent.innerHTML = `
                        <div class="typing-container">
                            <h4 class="w-txt mb-3">${this.escapeHtml(currentTerm.term)}</h4>
                            <input type="text" class="typing-input" id="typingInput" placeholder="Type the definition..." onkeypress="event.key === 'Enter' && app.submitTypingAnswer()">
                            <div style="display: flex; gap: 10px;">
                                <button class="btn vocab-btn" onclick="app.submitTypingAnswer()">Submit</button>
                                <button class="btn vocab-btn btn-secondary" onclick="app.revealAnswer()">Reveal</button>
                            </div>
                            <div id="revealedAnswer" style="display: none; margin-top: 20px; padding: 15px; background-color: rgba(255,255,255,0.08); border-radius: 8px;">
                                <small style="color: rgba(255,255,255,0.6);">Correct answer:</small>
                                <div style="color: white; font-weight: 600; margin-top: 8px;">${this.escapeHtml(currentTerm.definition)}</div>
                            </div>
                            <div id="studyFeedback" style="margin-top: 12px;"></div>
                        </div>
                    `;
                    setTimeout(() => document.getElementById('typingInput').focus(), 0);
                } else if (this.currentMode === 'learning') {
                    studyContent.innerHTML = `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 40px 0;">
                            <div>
                                <label class="term-label">Term</label>
                                <div style="background-color: rgba(255,255,255,0.08); border-radius: 8px; padding: 20px; border: 1px solid rgba(255,255,255,0.1);">
                                    <p style="color: white; font-size: 20px; font-weight: 600; margin: 0;">${this.escapeHtml(currentTerm.term)}</p>
                                </div>
                            </div>
                            <div>
                                <label class="term-label">Definition</label>
                                <div style="background-color: rgba(255,255,255,0.08); border-radius: 8px; padding: 20px; border: 1px solid rgba(255,255,255,0.1);">
                                    <p style="color: white; font-size: 20px; font-weight: 600; margin: 0;">${this.escapeHtml(currentTerm.definition)}</p>
                                </div>
                            </div>
                        </div>
                        <div style="text-align: center; margin-top: 40px;">
                            <button class="btn vocab-btn" onclick="app.nextLearningCard()">Next Card</button>
                        </div>
                    `;
                }
            }

            toggleFlashcard() {
                if (this.isFlipping) {
                    return;
                }

                const card = document.querySelector('.flashcard');
                if (!card) {
                    return;
                }

                this.isFlipping = true;
                card.classList.add('flipping');

                if (!this.flashcardFlipped) {
                    setTimeout(() => {
                        const currentTerm = this.currentSet.terms[this.currentIndex];
                        document.getElementById('flashcardContent').textContent = currentTerm.definition;
                        document.getElementById('flipHint').textContent = 'Click to flip back';
                        this.flashcardFlipped = true;
                        card.classList.add('flipped');
                    }, 225);
                } else {
                    setTimeout(() => {
                        const currentTerm = this.currentSet.terms[this.currentIndex];
                        document.getElementById('flashcardContent').textContent = currentTerm.term;
                        document.getElementById('flipHint').textContent = 'Click to reveal';
                        this.flashcardFlipped = false;
                        card.classList.remove('flipped');
                    }, 225);
                }

                setTimeout(() => {
                    card.classList.remove('flipping');
                    this.isFlipping = false;
                }, 450);
            }

            generateMultipleChoiceOptions(currentTerm) {
                const options = [{ text: currentTerm.definition, correct: true }];
                const availableTerms = this.currentSet.terms.filter(t => t.id !== currentTerm.id);
                
                while (options.length < 4 && availableTerms.length > 0) {
                    const randomIdx = Math.floor(Math.random() * availableTerms.length);
                    options.push({ text: availableTerms[randomIdx].definition, correct: false });
                    availableTerms.splice(randomIdx, 1);
                }

                return options.sort(() => Math.random() - 0.5);
            }

            submitFlashcardAnswer(result) {
                if (result === 'correct') this.studyResults.correct++;
                else if (result === 'incorrect') this.studyResults.incorrect++;
                else this.studyResults.skipped++;

                this.nextCard();
            }

            submitMultipleChoice(optionIndex, isCorrect) {
                const options = document.querySelectorAll('.choice-option');
                options.forEach(option => {
                    option.classList.add('disabled');
                    option.onclick = null;
                });

                const selected = document.querySelector(`.choice-option[data-index="${optionIndex}"]`);
                const correctDefinition = this.currentSet.terms[this.currentIndex].definition;
                const correctOption = Array.from(options).find(el => el.textContent.trim() === correctDefinition);

                if (selected) {
                    selected.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
                if (correctOption && !isCorrect) {
                    correctOption.classList.add('correct');
                }

                const feedbackEl = document.getElementById('studyFeedback');
                if (isCorrect) {
                    this.studyResults.correct++;
                    feedbackEl.innerHTML = `<div class="answer-feedback correct">Correct! Nice work.</div>`;
                } else {
                    this.studyResults.incorrect++;
                    feedbackEl.innerHTML = `<div class="answer-feedback incorrect">Incorrect.<div class="correct-answer">Correct answer: ${this.escapeHtml(correctDefinition)}</div></div>`;
                }

                feedbackEl.innerHTML += `<button class="btn vocab-btn mt-3" onclick="app.nextCard()">Next</button>`;
            }

            submitTypingAnswer() {
                const input = document.getElementById('typingInput').value.trim().toLowerCase();
                const correctDefinition = this.currentSet.terms[this.currentIndex].definition;
                const correct = correctDefinition.toLowerCase();
                const submitBtn = document.querySelector('#studyContent .btn.vocab-btn');
                const typingInput = document.getElementById('typingInput');
                const feedbackEl = document.getElementById('studyFeedback');

                if (!typingInput || typingInput.disabled) {
                    return;
                }

                typingInput.disabled = true;
                if (submitBtn) {
                    submitBtn.disabled = true;
                }

                if (input === correct) {
                    this.studyResults.correct++;
                    feedbackEl.innerHTML = `<div class="answer-feedback correct">Correct! Great answer.</div>`;
                } else {
                    this.studyResults.incorrect++;
                    feedbackEl.innerHTML = `<div class="answer-feedback incorrect">Incorrect.<div class="correct-answer">Correct answer: ${this.escapeHtml(correctDefinition)}</div></div>`;
                }

                feedbackEl.innerHTML += `<button class="btn vocab-btn mt-3" onclick="app.nextCard()">Next</button>`;
            }

            revealAnswer() {
                document.getElementById('revealedAnswer').style.display = 'block';
            }

            nextLearningCard() {
                this.currentIndex++;
                if (this.currentIndex >= this.currentSet.terms.length) {
                    this.finishStudySession();
                } else {
                    this.renderStudyContent();
                }
            }

            nextCard() {
                this.currentIndex++;
                if (this.currentIndex >= this.currentSet.terms.length) {
                    this.finishStudySession();
                } else {
                    this.renderStudyContent();
                }
            }

            updateProgressBar() {
                const progress = (this.currentIndex / this.currentSet.terms.length) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressText').textContent = `Card ${this.currentIndex + 1} of ${this.currentSet.terms.length}`;
            }

            finishStudySession() {
                if (this.currentMode === 'learning') {
                    this.currentSet.stats.studied += 1;
                    this.saveToLocalStorage();
                    this.showAlert('Learning Complete', 'Nice work. You finished all cards in Learning mode.').then(() => {
                        this.renderStudyModeSelection();
                        document.getElementById('studyContentView').style.display = 'none';
                        document.getElementById('resultsView').style.display = 'none';
                    });
                    return;
                }

                const total = this.currentSet.terms.length;
                const accuracy = Math.round((this.studyResults.correct / total) * 100);

                this.currentSet.stats.studied += 1;
                this.currentSet.stats.accuracy = accuracy;
                this.saveToLocalStorage();

                document.getElementById('accuracyScore').textContent = accuracy + '%';
                document.getElementById('correctCount').textContent = this.studyResults.correct;
                document.getElementById('incorrectCount').textContent = this.studyResults.incorrect;
                document.getElementById('skippedCount').textContent = this.studyResults.skipped;

                document.getElementById('studyContentView').style.display = 'none';
                document.getElementById('resultsView').style.display = 'block';
            }

            escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            app = new VocabularyApp();
        });
    </script>
</body>

</html>
