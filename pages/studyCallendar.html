<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <link rel="manifest" href="/calendar-manifest.json">
  <meta name="theme-color" content="#232329">
  <meta name="description" content="A dark-themed study calendar with local account login and MySQL storage">
  <title>Study Calendar</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <!-- Google Fonts for better typography -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />

  <style>
    * {
      color-scheme: dark;
    }

    html {
      background-color: #1f1f1f;
    }

    body {
      background-color: transparent;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .main-home-link {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1100;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 20, 20, 0.45);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .main-home-link:hover {
      color: #ffffff;
      border-color: rgba(6, 80, 241, 0.9);
      box-shadow: 0 0 0 3px rgba(6, 80, 241, 0.18);
    }

    @media (max-width: 600px) {
      .main-home-link {
        top: auto;
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 7px 12px;
        font-size: 13px;
      }
    }

      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    .calendar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      background-color: rgba(31, 31, 31, 0.5);
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      color: #ffffff;
      font-weight: 700;
      margin: 0;
    }

    .login-btn, .logout-btn {
      background: linear-gradient(135deg, #0650f1 0%, #ba06f1 100%);
      border: none;
      color: white;
      padding: 10px 25px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover, .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(6, 80, 241, 0.4);
      color: white;
      text-decoration: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      background-color: rgba(43, 43, 64, 0.3);
      border-radius: 15px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      color: #ffffff;
      font-size: 14px;
    }

    .login-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(31, 31, 31, 0.5);
    }

    .login-card {
      border-radius: 20px;
      background-color: rgba(43, 43, 64, 0.2);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      padding: 50px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-card h2 {
      color: #ffffff;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .login-card p {
      color: #b0b0b0;
      margin-bottom: 30px;
    }

    /* FullCalendar Dark Mode Styling */
    .fc {
      background-color: transparent;
      color: #ffffff;
    }

    .fc .fc-button-primary {
      background-color: #0650f1;
      border-color: #0650f1;
    }

    .fc .fc-button-primary:hover {
      background-color: #ba06f1;
      border-color: #ba06f1;
    }

    .fc .fc-button-primary.fc-button-active {
      background-color: #ba06f1;
      border-color: #ba06f1;
    }

    .fc .fc-col-header-cell {
      background-color: #2a2a3a;
      border-color: #3a3a4a;
      color: #ffffff;
      font-weight: 600;
    }

    .fc .fc-daygrid-day {
      background-color: rgba(31, 31, 31, 0.3);
      border-color: #3a3a4a;
    }

    .fc .fc-daygrid-day-number {
      color: #ffffff;
      padding: 8px;
    }

    .fc .fc-daygrid-day.fc-day-other {
      background-color: #161616;
      opacity: 0.5;
    }

    .fc .fc-daygrid-day.fc-day-today {
      background-color: rgba(6, 80, 241, 0.15);
      border-color: #0650f1;
    }

    .fc .fc-event {
      background-color: #0650f1;
      border-color: #0650f1;
      border-radius: 8px;
    }

    .fc .fc-event:hover {
      background-color: #ba06f1;
      border-color: #ba06f1;
    }

    .fc .fc-event-title {
      color: #ffffff;
      font-weight: 500;
      padding: 2px 4px;
    }

    .fc .fc-timegrid-slot {
      height: 3em;
    }

    .fc .fc-timegrid-cell {
      border-color: #3a3a4a;
    }

    .fc .fc-timegrid-cell-label {
      color: #808080;
      font-size: 0.85em;
    }

    .fc .fc-daygrid-body {
      border-color: #3a3a4a;
    }

    .fc .fc-popover {
      background-color: #2a2a3a;
      border-color: #3a3a4a;
    }

    #calendar {
      background-color: #1f1f1f;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      min-height: 700px !important;
    }

    .fc .fc-popover-header {
      background-color: #3a3a4a;
      color: #ffffff;
    }

    .fc .fc-popover-body {
      color: #ffffff;
    }

    .fc-theme-standard .fc-scrollgrid {
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 10px;
      border-collapse: separate !important;
      border-spacing: 0;
      overflow: hidden;
    }

    .fc-theme-standard td, .fc-theme-standard th {
      border-color: #3a3a4a;
    }

    .events-list {
      background-color: rgba(43, 43, 64, 0.2);
      border-radius: 15px;
      padding: 20px;
      margin-top: 30px;
      max-height: 400px;
      overflow-y: auto;
    }

    .events-list h3 {
      color: #ffffff;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .event-item {
      background-color: rgba(6, 80, 241, 0.1);
      border-left: 3px solid #0650f1;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 14px;
    }

    .event-item-exam {
      background-color: rgba(241, 155, 6, 0.1);
      border-left: 3px solid #f19b06;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 14px;
    }

    .event-item-vacation {
      background-color: rgba(46, 204, 133, 0.1);
      border-left: 3px solid #2ecc71;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 14px;
    }

    .event-item-time {
      color: #808080;
      font-size: 12px;
      margin-top: 5px;
    }

    .loading {
      text-align: center;
      color: #b0b0b0;
      padding: 40px 20px;
    }

    .spinner {
      border: 4px solid rgba(6, 80, 241, 0.2);
      border-top: 4px solid #0650f1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    #calendar {
      min-height: 600px;
      background-color: #1f1f1f;
    }

    .error-message {
      background-color: rgba(239, 3, 38, 0.15);
      border-left: 3px solid #ef0326;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .success-message {
      background-color: rgba(6, 80, 241, 0.15);
      border-left: 3px solid #0650f1;
      color: #7dd3fc;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(6, 80, 241, 0.5);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 80, 241, 0.8);
    }

    .install-btn:hover {
      background-color: rgba(6, 80, 241, 0.1) !important;
      border-color: #ba06f1 !important;
      color: #ba06f1 !important;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 30px 20px;
      }

      .header {
        justify-content: center;
      }

      .fc-col-header-cell {
        font-size: 0.75em;
      }

      .fc-daygrid-day-number {
        font-size: 0.85em;
      }
    }

    /* Mobile-specific improvements */
    @media (max-width: 600px) {
      .calendar-container {
        padding: 12px;
        min-height: auto;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .header h1 {
        font-size: 1.25rem;
        margin-bottom: 0;
      }

      #userSection {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #calendar {
        padding: 8px;
        border-radius: 8px;
        min-height: 480px;
      }

      .events-list {
        margin-top: 16px;
        max-height: 240px;
        padding: 12px;
      }

      .fc .fc-button, .fc .fc-button-primary {
        padding: 8px 10px;
        font-size: 0.9rem;
        border-radius: 8px;
      }

      .fc .fc-col-header-cell {
        font-size: 0.72em;
      }

      .login-card {
        padding: 20px;
        width: 92vw;
      }

      .login-btn, .logout-btn {
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 15px;
      }

      /* Modal adjustments for small screens */
      .event-modal {
        max-width: 95vw !important;
        width: 95vw !important;
        padding: 18px !important;
        border-radius: 12px !important;
      }

      .event-modal-buttons {
        flex-direction: column !important;
      }

      .event-modal-buttons button {
        width: 100% !important;
        margin-bottom: 8px;
      }

      /* make background SVG less dominant on small screens */
      body::before {
        width: 110vmin;
        height: 110vmin;
        opacity: 0.2;
      }

      /* Move calendar title above the view switch (month/week/day) */
      .fc .fc-toolbar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }

      .fc .fc-toolbar-chunk {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      /* Ensure the center chunk (title) appears above the right chunk (view buttons) */
      .fc .fc-toolbar-chunk:nth-child(1) { order: 1; }
      .fc .fc-toolbar-chunk:nth-child(2) { order: 2; }
      .fc .fc-toolbar-chunk:nth-child(3) { order: 3; }

      .fc .fc-toolbar .fc-toolbar-chunk .fc-toolbar-title {
        font-size: 1.15rem;
        text-align: left;
        flex: 1;
      }

      /* Push view buttons to the right on their row */
      .fc .fc-toolbar-chunk:nth-child(3) {
        justify-content: flex-end;
      }

      /* Make view buttons wrap nicely when space is tight */
      .fc .fc-button-group, .fc .fc-button {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body class="bg">
  <a class="main-home-link" href="../main.html" aria-label="Return to main page">Main Page</a>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>📚 Study Calendar</h2>
      <p>Sign in with your username and password to access your calendar</p>
      <div style="display: grid; gap: 12px; min-width: 280px;">
        <input id="usernameInput" type="text" placeholder="Username" style="padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3a4a; background: #1f1f1f; color: #fff;">
        <input id="passwordInput" type="password" placeholder="Password" style="padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3a4a; background: #1f1f1f; color: #fff;">
        <div id="loginErrorMessage" style="display: none; padding: 10px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fecaca; font-size: 14px;"></div>
        <button id="loginBtn" class="login-btn">Login</button>
        <a href="./register.html" style="color: #8ab3ff; text-decoration: none; font-size: 14px;">Create account</a>
      </div>
    </div>
  </div>

  <!-- Calendar Screen -->
  <div id="calendarScreen" style="display: none;">
    <div class="calendar-container">
      <div class="header">
        <h1>📚 Study Calendar</h1>
        <div id="userSection" style="display: flex; gap: 15px; align-items: center;">
          <button id="installBtn" class="install-btn" style="display: none; background: transparent; border: 1px solid #0650f1; color: #0650f1; padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.3s ease;">
            📲 Install App
          </button>
          <div id="userInfo" class="user-info">
            <span id="userName" class="user-name"></span>
          </div>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>

      <div id="messageContainer"></div>

      <!-- Calendar -->
      <div id="calendar" style="border: 2px solid #0650f1; background: transparent; min-height: 700px;"></div>

      <!-- Upcoming Events -->
      <div id="eventsList" class="events-list">
        <h3>📅 Upcoming Events</h3>
        <div id="upcomingEvents">
          <p style="color: #808080;">Loading events...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- FullCalendar Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    // Configuration
    const defaultApiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:5050/api'
      : '/api';

    const CONFIG = {
      API_BASE_URL: localStorage.getItem('calendarApiBase') || defaultApiBase
    };

    // Global variables
    let calendar;
    let accessToken = null;
    let userProfile = null;
    let selectedEvent = null;
    let selectedDateRange = null;
    let formOpenTime = 0;
    let loggedIn = false;

    function setStoredAuth(token) {
      accessToken = token;
      localStorage.setItem('calendarAuthToken', token);
    }

    function clearStoredAuth() {
      accessToken = null;
      localStorage.removeItem('calendarAuthToken');
    }

    function getStoredAccessToken() {
      const token = localStorage.getItem('calendarAuthToken');
      if (token) {
        accessToken = token;
        return true;
      }
      return false;
    }

    async function apiFetch(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };

      if (accessToken) {
        headers['Authorization'] = `Bearer ${accessToken}`;
      }

      const response = await fetch(`${CONFIG.API_BASE_URL}${path}`, {
        ...options,
        headers
      });

      if (response.status === 401) {
        clearStoredAuth();
        if (loggedIn) {
          showMessage('Session expired. Please login again.', 'error');
          logout();
        }
      }

      return response;
    }

    async function parseResponseJsonSafe(response) {
      const rawText = await response.text();
      if (!rawText) {
        return {};
      }

      try {
        return JSON.parse(rawText);
      } catch {
        return {
          error: `Unexpected non-JSON response (HTTP ${response.status})`,
          raw: rawText
        };
      }
    }

    async function checkExistingAuth() {
      if (!getStoredAccessToken()) {
        return;
      }

      const success = await fetchUserProfile();
      if (success) {
        await loginUser();
      } else {
        clearStoredAuth();
      }
    }

    async function fetchUserProfile() {
      try {
        if (!accessToken) {
          throw new Error('No auth token available');
        }

        const response = await apiFetch('/auth/me', { method: 'GET' });
        if (!response.ok) {
          throw new Error(`Failed to fetch user profile: ${response.status}`);
        }

        const data = await parseResponseJsonSafe(response);
        userProfile = data.user || null;
        updateUserInfo();
        return true;
      } catch (error) {
        console.error('Error fetching user profile:', error);
        return false;
      }
    }

    function updateUserInfo() {
      const userNameEl = document.getElementById('userName');
      if (!userNameEl) {
        return;
      }

      if (userProfile) {
        userNameEl.textContent = userProfile.username;
      } else {
        userNameEl.textContent = 'Unknown user';
      }
    }

    async function loginWithPassword(username, password) {
      const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await parseResponseJsonSafe(response);
      if (!response.ok || !data.token) {
        throw new Error(data.error || 'Invalid username or password');
      }

      setStoredAuth(data.token);
      userProfile = data.user || null;
      updateUserInfo();
      return true;
    }

    // Fetch all-day events from local API
    async function fetchCalendarEvents() {
      try {
        const normalizeApiDate = (value) => {
          if (!value) return '';
          // Already in YYYY-MM-DD format.
          if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
            return value;
          }
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) {
            return '';
          }
          return d.toISOString().slice(0, 10);
        };

        const response = await apiFetch('/events', {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error('Failed to fetch events');
        }

        const data = await parseResponseJsonSafe(response);
        return (data.events || []).map(event => ({
          id: String(event.event_id),
          summary: event.title,
          start: { date: normalizeApiDate(event.start_date) },
          end: { date: normalizeApiDate(event.end_date) },
          description: event.description,
          colorHex: event.color_hex
        }));
      } catch (error) {
        console.error('Error fetching events:', error);
        showMessage('Failed to fetch calendar events', 'error');
        return [];
      }
    }

    // Create event is aliased to all-day create for this local backend
    async function createEvent(title, startDate, endDate) {
      return createEventAllDay(title, startDate, endDate);
    }

    // Create new all-day event
    async function createEventAllDay(title, startDate, endDate) {
      try {
        if (!title) throw new Error('Event title is required');
        if (!startDate) throw new Error('Start date is required');
        if (!endDate) endDate = startDate;

        const response = await apiFetch('/events', {
          method: 'POST',
          body: JSON.stringify({
            title,
            start_date: startDate,
            end_date: endDate,
            description: 'Created via Study Calendar',
            color_hex: '#0650f1'
          })
        });

        const data = await parseResponseJsonSafe(response);
        if (!response.ok) {
          throw new Error(data.error || 'Failed to create event');
        }

        showMessage('Event created successfully!', 'success');
        await refreshCalendar();
        return data;
      } catch (error) {
        console.error('Error creating event:', error);
        showMessage('Failed to create event: ' + error.message, 'error');
        return null;
      }
    }

    // Update event
    async function updateEvent(eventId, updatedData) {
      try {
        const title = updatedData?.summary || 'Untitled';
        const startDate = updatedData?.start?.date;
        const endDate = updatedData?.end?.date || startDate;

        const response = await apiFetch(`/events/${eventId}`, {
          method: 'PUT',
          body: JSON.stringify({
            title,
            start_date: startDate,
            end_date: endDate,
            description: updatedData?.description || null,
            color_hex: '#0650f1'
          })
        });

        const data = await parseResponseJsonSafe(response);
        if (!response.ok) {
          throw new Error(data.error || 'Failed to update event');
        }

        showMessage('Event updated successfully!', 'success');
        await refreshCalendar();
        return true;
      } catch (error) {
        console.error('Error updating event:', error);
        showMessage('Failed to update event: ' + error.message, 'error');
        return false;
      }
    }

    // Delete event without confirmation
    async function deleteEventWithoutConfirm(eventId) {
      try {
        const response = await apiFetch(`/events/${eventId}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const data = await parseResponseJsonSafe(response);
          throw new Error(data.error || 'Failed to delete event');
        }

        showMessage('Event deleted successfully!', 'success');
        await refreshCalendar();
        return true;
      } catch (error) {
        console.error('Error deleting event:', error);
        showMessage('Failed to delete event: ' + error.message, 'error');
        return false;
      }
    }

    // Delete event
    async function deleteEvent(eventId) {
      try {
        if (!confirm('Are you sure you want to delete this event?')) return false;
        return deleteEventWithoutConfirm(eventId);
      } catch (error) {
        console.error('Error deleting event:', error);
        showMessage('Failed to delete event: ' + error.message, 'error');
        return false;
      }
    }

    // Refresh calendar
    async function refreshCalendar() {
      if (calendar) {
        calendar.destroy();
      }
      await initializeCalendar();
    }

    // Initialize calendar
    async function initializeCalendar() {
      try {
        console.log('=== Starting calendar initialization ===');
        const calendarEl = document.getElementById('calendar');
        console.log('Calendar element:', calendarEl);
        console.log('FullCalendar available:', typeof FullCalendar);
        
        if (!calendarEl) {
          console.error('ERROR: Calendar element not found in DOM');
          showMessage('Calendar element not found', 'error');
          return;
        }

        const events = await fetchCalendarEvents();
        console.log('Events fetched:', events.length);

        const addOneDayIso = (dateValue) => {
          if (!dateValue) return dateValue;
          const d = /^\d{4}-\d{2}-\d{2}$/.test(dateValue)
            ? new Date(dateValue + 'T00:00:00')
            : new Date(dateValue);
          if (Number.isNaN(d.getTime())) {
            return '';
          }
          d.setDate(d.getDate() + 1);
          return d.toISOString().slice(0, 10);
        };
        
        // Format events for FullCalendar
        const formattedEvents = events.map(event => {
          const summaryText = (event.summary || '').toLowerCase();
          const isExam = summaryText.includes('prüfung');
          const isVacation = summaryText.includes('ferien');
          const eventColor = isVacation ? '#2ecc71' : (isExam ? '#f19b06' : '#0650f1');

          return {
            id: event.id,
            title: event.summary || 'No title',
            start: event.start.dateTime || event.start.date,
            // FullCalendar expects all-day end dates as exclusive.
            end: event.end.dateTime || addOneDayIso(event.end.date),
            backgroundColor: eventColor,
            borderColor: eventColor,
            extendedProps: {
              dbEventId: event.id,
              description: event.description,
              location: event.location
            }
          };
        });
        
        console.log('Formatted events:', formattedEvents);

        // Destroy existing calendar if any
        if (calendar) {
          console.log('Destroying existing calendar');
          calendar.destroy();
          calendar = null;
        }

        console.log('Creating FullCalendar instance...');
        
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          firstDay: 1,
          headerToolbar: {
            left: 'prev,next today addEventBtn',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          customButtons: {
            addEventBtn: {
              text: '+ Add Event',
              click: function() {
                console.log('Add Event button clicked');
                showEventForm();
              }
            }
          },
          height: 'auto',
          contentHeight: 'auto',
          selectable: true,
            select: function(info) {
              console.log('Date selected:', info.startStr, 'to', info.endStr);
              selectedDateRange = {
                start: info.start,
                end: info.end
              };
              showEventForm();
            },
            // single-tap handler for mobile devices
            dateClick: function(info) {
              try {
                console.log('Date clicked:', info.dateStr, info.date);
                selectedDateRange = { start: info.date, end: info.date };
                showEventForm();
              } catch (e) {
                console.error('dateClick handler error:', e);
              }
            },
          eventClick: function(info) {
            console.log('Event clicked:', info.event.title);
            handleEventClick(info);
          },
          events: formattedEvents
        });

        console.log('Calendar instance created, now rendering...');
        calendar.render();
        console.log('Calendar rendered!');
        
        displayUpcomingEvents(events);
        console.log('=== Calendar initialization COMPLETE ===');
      } catch (error) {
        console.error('ERROR in initializeCalendar:', error);
        console.error('Error stack:', error.stack);
        showMessage('Failed to initialize calendar: ' + error.message, 'error');
      }
    }

    // Display upcoming events
    function displayUpcomingEvents(events) {
      const upcomingContainer = document.getElementById('upcomingEvents');
      const now = new Date();
      
      const upcomingEvents = events
        .filter(event => new Date(event.start.dateTime || event.start.date) > now)
        .sort((a, b) => new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date))
        .slice(0, 10);

      if (upcomingEvents.length === 0) {
        upcomingContainer.innerHTML = '<p style="color: #808080;">No upcoming events</p>';
        return;
      }

      upcomingContainer.innerHTML = upcomingEvents.map(event => {
        const startTime = new Date(event.start.dateTime || event.start.date);
        const timeStr = event.start.dateTime 
          ? startTime.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          : startTime.toLocaleString('en-US', { month: 'short', day: 'numeric' });

        if (event.summary.includes("Prüfung"))
      {
        return `
          <div class="event-item-exam">
            <strong>${event.summary || 'No title'}</strong>
            <div class="event-item-time">${timeStr}</div>
          </div>
        `;
      }
      else if (event.summary.includes("Ferien"))
      {
        return `
          <div class="event-item-vacation">
            <strong>${event.summary || 'No title'}</strong>
            <div class="event-item-time">${timeStr}</div>
          </div>
        `;
      }
      else
      {
        return `
          <div class="event-item">
            <strong>${event.summary || 'No title'}</strong>
            <div class="event-item-time">${timeStr}</div>
          </div>
        `;
      }
      }).join('');
    }

    // Handle event click
    function handleEventClick(info) {
      const event = info.event;
      selectedEvent = event;
      showEventForm(event);
    }

    // Handle date select
    function handleDateSelect(info) {
      selectedDateRange = {
        start: info.start,
        end: info.end
      };
      showEventForm();
    }

    // Show event form modal
    function showEventForm(event = null) {
      // Debounce: prevent duplicate modals within 100ms
      const now = Date.now();
      if (now - formOpenTime < 100) {
        return;
      }
      formOpenTime = now;
      
      const title = event ? event.title : '';
      // Local date helper to avoid UTC shifts
      const dateToLocalYYYYMMDD = (d) => {
        if (!d) return '';
        const date = new Date(d);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };
      const getLocalDateString = () => dateToLocalYYYYMMDD(new Date());
      const subtractOneDay = (isoDate) => {
        if (!isoDate) return '';
        const d = new Date(isoDate + 'T00:00:00');
        d.setDate(d.getDate() - 1);
        return dateToLocalYYYYMMDD(d);
      };

      // derive start/end values; if the FullCalendar event has no `end` or it
      // equals the start date we treat it as a single‑day event.
      const startDate = event ? dateToLocalYYYYMMDD(event.start) : (selectedDateRange ? dateToLocalYYYYMMDD(selectedDateRange.start) : getLocalDateString());
      let endDate = startDate;
      if (event && event.end) {
        // FullCalendar all-day `end` is exclusive; convert to inclusive for DB/UI.
        const ed = subtractOneDay(dateToLocalYYYYMMDD(event.end));
        endDate = ed || startDate;
      }

      const isMultiDay = event && event.end
        ? (dateToLocalYYYYMMDD(event.end) !== dateToLocalYYYYMMDD(event.start))
        : false;
      const isAllDay = event ? true : true; // New events default to all-day

      const modal = document.createElement('div');
      modal.className = 'event-modal-overlay';
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      `;

      const form = document.createElement('div');
      form.className = 'event-modal';
      form.style.cssText = `
        background: #2a2a3a;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 30px rgba(0,0,0,0.5);
        max-width: 500px;
        width: 90%;
        color: #ffffff;
      `;

      form.innerHTML = `
        <h3 style="margin-top: 0; color: #ffffff;">${event ? 'Edit Event' : 'Create Event'}</h3>
        
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; color: #b0b0b0;">Event Title</label>
          <input type="text" id="eventTitle" value="${title}" placeholder="Enter event title" style="
            width: 100%;
            padding: 10px;
            border: 1px solid #3a3a4a;
            background: #1f1f1f;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
          ">
        </div>

        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="allDayCheckbox" ${isAllDay ? 'checked' : ''} checked disabled style="cursor: not-allowed; opacity: 0.7;">
          <label for="allDayCheckbox" style="color: #b0b0b0; cursor: default; margin: 0;">All-day event (only mode supported)</label>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; color: #b0b0b0;">Start Date</label>
          <input type="date" id="eventStart" value="${startDate}" style="
            width: 100%;
            padding: 10px;
            border: 1px solid #3a3a4a;
            background: #1f1f1f;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
          ">
        </div>

        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="multiDayCheckbox" ${isMultiDay ? 'checked' : ''} style="cursor: pointer;">
          <label for="multiDayCheckbox" style="color: #b0b0b0; cursor: pointer; margin: 0;">Multiple days</label>
        </div>

        <div id="endDateContainer" style="margin-bottom: 15px; display: ${isMultiDay ? 'block' : 'none'};">
          <label style="display: block; margin-bottom: 5px; color: #b0b0b0;">End Date</label>
          <input type="date" id="eventEnd" value="${endDate}" style="
            width: 100%;
            padding: 10px;
            border: 1px solid #3a3a4a;
            background: #1f1f1f;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
          ">
        </div>

        <div id="startTimeContainer" style="margin-bottom: 15px; display: none;">
          <label style="display: block; margin-bottom: 5px; color: #b0b0b0;">Start Time</label>
          <input type="time" id="eventStartTime" style="
            width: 100%;
            padding: 10px;
            border: 1px solid #3a3a4a;
            background: #1f1f1f;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
          ">
        </div>

        <div id="endTimeContainer" style="margin-bottom: 20px; display: none;">
          <label style="display: block; margin-bottom: 5px; color: #b0b0b0;">End Time</label>
          <input type="time" id="eventEndTime" style="
            width: 100%;
            padding: 10px;
            border: 1px solid #3a3a4a;
            background: #1f1f1f;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
          ">
        </div>

        <div class="event-modal-buttons" style="display: flex; gap: 10px;">
          <button id="saveEventBtn" style="
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #0650f1 0%, #ba06f1 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
          ">Save Event</button>
          <button id="cancelBtn" style="
            flex: 1;
            padding: 10px;
            background: #3a3a4a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
          ">Cancel</button>
          ${event ? `<button id="deleteEventBtn" style="
            flex: 0.8;
            padding: 10px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
          ">Delete</button>` : ''}
        </div>
      `;

      modal.appendChild(form);
      document.body.appendChild(modal);

      // Query buttons from within the form to avoid ID conflicts
      const saveEventBtn = form.querySelector('#saveEventBtn');
      const cancelBtn = form.querySelector('#cancelBtn');
      const deleteBtn = form.querySelector('#deleteEventBtn');
      
      // Get checkboxes from form
      const allDayCheckbox = form.querySelector('#allDayCheckbox');
      const multiDayCheckbox = form.querySelector('#multiDayCheckbox');
      const startTimeContainer = form.querySelector('#startTimeContainer');
      const endTimeContainer = form.querySelector('#endTimeContainer');
      const endDateContainer = form.querySelector('#endDateContainer');

      // Handle all-day checkbox
      if (allDayCheckbox) {
        allDayCheckbox.addEventListener('change', () => {
          if (allDayCheckbox.checked) {
            startTimeContainer.style.display = 'none';
            endTimeContainer.style.display = 'none';
          } else {
            startTimeContainer.style.display = 'block';
            endTimeContainer.style.display = 'block';
          }
        });
      }

      // Handle multi-day checkbox
      if (multiDayCheckbox) {
        multiDayCheckbox.addEventListener('change', () => {
          if (multiDayCheckbox.checked) {
            endDateContainer.style.display = 'block';
          } else {
            endDateContainer.style.display = 'none';
            // Reset end date to start date when unchecking
            const eventEnd = form.querySelector('#eventEnd');
            const eventStart = form.querySelector('#eventStart');
            if (eventEnd && eventStart) {
              eventEnd.value = eventStart.value;
            }
          }
        });
      }

      // Save button handler
      if (saveEventBtn) {
        saveEventBtn.addEventListener('click', async () => {
          try {
            const titleInput = form.querySelector('#eventTitle').value;
            const startDateInput = form.querySelector('#eventStart').value;
            let endDateInput = form.querySelector('#eventEnd').value;

            if (!titleInput || !startDateInput) {
              showMessage('Please fill in all fields', 'error');
              return;
            }

            // If multi-day is not checked, end date equals start date
            if (!multiDayCheckbox.checked) {
              endDateInput = startDateInput;
            }

            if (!endDateInput) {
              showMessage('Please select an end date', 'error');
              return;
            }

            let startDateTime, endDateTime;

            if (allDayCheckbox.checked) {
              // All-day event
              startDateTime = startDateInput;
              endDateTime = endDateInput;
            } else {
              // Timed event
              const startTimeInput = form.querySelector('#eventStartTime').value;
              const endTimeInput = form.querySelector('#eventEndTime').value;
              
              if (!startTimeInput || !endTimeInput) {
                showMessage('Please fill in all time fields', 'error');
                return;
              }
              
              startDateTime = new Date(startDateInput + 'T' + startTimeInput).toISOString();
              endDateTime = new Date(endDateInput + 'T' + endTimeInput).toISOString();
            }

            if (!allDayCheckbox.checked) {
              showMessage('Only all-day events are supported in local DB mode.', 'error');
              return;
            }

            if (event) {
              // Update existing event
              const eventData = {
                summary: titleInput,
                start: allDayCheckbox.checked ? { date: startDateTime } : { dateTime: startDateTime },
                end: allDayCheckbox.checked ? { date: endDateTime } : { dateTime: endDateTime }
              };
              await updateEvent(event.id, eventData);
            } else {
              // Create new event
              if (allDayCheckbox.checked) {
                await createEventAllDay(titleInput, startDateTime, endDateTime);
              } else {
                await createEvent(titleInput, startDateTime, endDateTime);
              }
            }

            // Safely remove modal
            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
            selectedDateRange = null;
            selectedEvent = null;
          } catch (e) {
            console.error('Error saving event:', e);
            showMessage('Error saving event: ' + e.message, 'error');
          }
        });
      }

      // Cancel button handler
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          try {
            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
            selectedDateRange = null;
            selectedEvent = null;
          } catch (e) {
            console.error('Error closing modal:', e);
            // Fallback: hide modal if removal fails
            if (modal) modal.style.display = 'none';
          }
        });
      }

      // Delete button handler
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (confirm('Are you sure you want to delete this event?')) {
            await deleteEventWithoutConfirm(event.id);
            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
          }
        });
      }
    }

    // Handle dates set
    function handleDatesSet(info) {
      console.log('Calendar dates changed', info);
    }

    // Show message
    function showMessage(message, type = 'info') {
      const container = document.getElementById('messageContainer');
      const messageClass = type === 'error' ? 'error-message' : 'success-message';
      container.innerHTML = `<div class="${messageClass}">${message}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // Login flow
    async function loginUser() {
      try {
        loggedIn = true;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('calendarScreen').style.display = 'block';

        console.log('Fetching user profile...');
        if (!await fetchUserProfile()) {
          console.error('Failed to fetch user profile');
          showMessage('Failed to authenticate. Please log in again.', 'error');
          setTimeout(() => logout(), 2000);
          return;
        }

        console.log('Initializing calendar...');
        await initializeCalendar();
        showMessage('Welcome! Your calendar is loaded.', 'success');
      } catch (error) {
        console.error('Login error:', error);
        showMessage('Login failed: ' + error.message, 'error');
        setTimeout(() => logout(), 2000);
      }
    }

    // Logout
    function logout() {
      clearStoredAuth();
      userProfile = null;
      loggedIn = false;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('calendarScreen').style.display = 'none';
      document.getElementById('messageContainer').innerHTML = '';
      if (calendar) calendar.destroy();

      showMessage('Logged out successfully. You can now sign in with a different account.', 'success');
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', async () => {
      const loginBtn = document.getElementById('loginBtn');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginErrorMessage = document.getElementById('loginErrorMessage');

      function showLoginError(message) {
        if (loginErrorMessage) {
          loginErrorMessage.textContent = message;
          loginErrorMessage.style.display = 'block';
        }
      }

      function clearLoginError() {
        if (loginErrorMessage) {
          loginErrorMessage.style.display = 'none';
        }
      }

      // Clear error when user starts typing
      usernameInput?.addEventListener('input', clearLoginError);
      passwordInput?.addEventListener('input', clearLoginError);

      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          try {
            clearLoginError();
            const username = (usernameInput?.value || '').trim();
            const password = passwordInput?.value || '';

            if (!username || !password) {
              showLoginError('Please enter both username and password');
              return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            await loginWithPassword(username, password);
            await loginUser();
          } catch (error) {
            const errorMsg = error.message || 'Login failed. Please try again.';
            showLoginError(errorMsg);
          } finally {
            if (loginBtn) {
              loginBtn.disabled = false;
              loginBtn.textContent = 'Login';
            }
          }
        });
      }

      if (passwordInput) {
        passwordInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter') {
            loginBtn?.click();
          }
        });
      }

      // Try restoring existing local auth token
      await checkExistingAuth();

      // Logout button handler
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // PWA Install functionality
      initializePWAInstall();
    });

    // PWA Install handler
    let deferredPrompt;
    function initializePWAInstall() {
      const installBtn = document.getElementById('installBtn');
      
      // Listen for install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show install button
        installBtn.style.display = 'block';
        installBtn.addEventListener('click', installPWA);
      });

      // Hide button if already installed
      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
      });

      // Check if already installed (PWA mode)
      if (window.matchMedia('(display-mode: standalone)').matches) {
        installBtn.style.display = 'none';
      }
    }

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install prompt: ${outcome}`);
        deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      }
    }

    // Service Worker registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('Service Worker registered:', reg);
        }).catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }

    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log('App running as PWA');
    }
  </script>
</body>
