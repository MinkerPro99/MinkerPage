<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <link rel="manifest" href="/calendar-manifest.json">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="description" content="A dark-themed study calendar with local account login and MySQL storage">
  <title>Study Calendar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />

  <style>
    /* ==========================================
       1. GLOBAL SYSTEM RESETS & VARIABLES
       ========================================== */
    * {
      color-scheme: dark;
      box-sizing: border-box;
    }

    body {
      background-color: #1f1f1f !important;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* System scrollbars tailored for the elite layout */
    ::-webkit-scrollbar { 
      width: 6px; 
      height: 6px; 
    }
    ::-webkit-scrollbar-track { 
      background: transparent; 
    }
    ::-webkit-scrollbar-thumb { 
      background: rgba(255, 255, 255, 0.1); 
      border-radius: 10px; 
    }
    ::-webkit-scrollbar-thumb:hover { 
      background: rgba(166, 0, 207, 0.4); 
    }

    /* ==========================================
       2. NAVIGATION NODE CONTROL UNITS
       ========================================== */
    .main-home-link {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 1100;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(30, 30, 46, 0.65);
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }

    .main-home-link:hover {
      background: rgba(166, 0, 207, 0.15);
      border-color: rgba(166, 0, 207, 0.5);
      box-shadow: 0 8px 20px rgba(166, 0, 207, 0.2);
      color: #ffffff;
    }

    /* ==========================================
       3. CONTAINMENT MATRIX (The Main Dashboard)
       ========================================== */
    .calendar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      color: #ffffff;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
    }

    /* Actions and Authorization Panels */
    .login-btn, .logout-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-btn:hover, .logout-btn:hover {
      transform: translateY(-2px);
      background: rgba(166, 0, 207, 0.15);
      border-color: rgba(166, 0, 207, 0.5);
      box-shadow: 0 8px 20px rgba(166, 0, 207, 0.2);
      color: white;
      text-decoration: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      background-color: rgba(30, 30, 46, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .user-name {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
    }

    /* Secure Login Interface */
    .login-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .login-card {
      border-radius: 20px;
      background-color: rgba(22, 22, 30, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      padding: 45px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      max-width: 400px;
      width: 90%;
    }

    .login-card h2 {
      color: #ffffff;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .login-card p {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .login-field {
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      background: rgba(0, 0, 0, 0.3) !important;
      color: #fff !important;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .login-field:focus {
      outline: none;
      border-color: #a600cf !important;
      box-shadow: 0 0 12px rgba(166, 0, 207, 0.3);
    }

    /* ==========================================
       4. FULLCALENDAR CORE MODS (Transparency Layer Patch)
       ========================================== */
    #calendar {
      background-color: rgba(22, 22, 30, 0.55) !important; 
      /* Low blur scale so the logo is crisp and visible */
      backdrop-filter: blur(2px) !important;
      -webkit-backdrop-filter: blur(2px) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding: 24px;
      border-radius: 20px !important; 
      margin-bottom: 30px;
      overflow: hidden; 
    }

    .fc {
      color: #ffffff !important;
    }

    /* Nukes scuffed default web outlines and underlines */
    .fc a {
      color: #ffffff !important;
      text-decoration: none !important;
      box-shadow: none !important;
    }
    
    .fc a:hover {
      color: #a600cf !important;
    }

    .fc .fc-toolbar-title {
      color: #ffffff !important;
      font-weight: 700;
    }

    /* Unifying main calendar controls */
    .fc .fc-button-primary {
      background-color: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #e2e8f0 !important;
      text-transform: capitalize;
      font-weight: 600 !important;
      box-shadow: none !important;
      transition: all 0.2s ease;
    }

    .fc .fc-button-primary:hover {
      background-color: rgba(166, 0, 207, 0.15) !important;
      border-color: rgba(166, 0, 207, 0.4) !important;
      color: #fff !important;
    }

    .fc .fc-button-primary.fc-button-active, 
    .fc .fc-button-primary:active {
      background-color: #a600cf !important;
      border-color: #a600cf !important;
      color: #fff !important;
    }

    /* Overwrites the header bars where day names live */
    .fc .fc-col-header-cell {
      background-color: rgba(30, 30, 46, 0.85) !important; 
      border-color: rgba(255, 255, 255, 0.08) !important;
      padding: 12px 0 !important;
    }
    
    .fc .fc-col-header-cell-cushion {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    /* FIX: Force all middle layout containers to be 100% transparent */
    .fc-theme-standard td, 
    .fc-theme-standard th,
    .fc-theme-standard .fc-scrollgrid,
    .fc-theme-standard .fc-scrollgrid-chunk table,
    .fc-scrollgrid-section,
    .fc-scrollgrid-section-body,
    .fc-scrollgrid-section-table {
      background: transparent !important;
      background-color: transparent !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
    }

    /* ONLY the individual day boxes get a single light tint */
    .fc .fc-daygrid-day {
      background-color: rgba(0, 0, 0, 0.2) !important; 
      border-color: rgba(255, 255, 255, 0.08) !important; 
    }

    .fc .fc-daygrid-day-number {
      color: #ffffff !important; 
      padding: 8px;
      font-weight: 500;
    }

    /* Darkening dates outside current scope */
    .fc .fc-daygrid-day.fc-day-other {
      background-color: rgba(0, 0, 0, 0.55) !important; 
      opacity: 0.3;
    }

    /* Active Today Cell Indicator */
    .fc .fc-daygrid-day.fc-day-today {
      background-color: rgba(166, 0, 207, 0.12) !important;
      border: 2px solid #a600cf !important;
    }

    /* Hard-locking container tables to kill white leaking outline artifacts */
    .fc-theme-standard .fc-scrollgrid {
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 14px !important;
      border-collapse: separate !important;
      border-spacing: 0;
      overflow: hidden;
    }

    /* Interactive task entities inside grid */
    .fc .fc-event {
      border-radius: 6px;
      padding: 2px 4px;
      font-size: 0.9em;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .fc .fc-event-title {
      font-weight: 600;
    }

    /* ==========================================
       5. UPCOMING EVENT MODULES & POPUPS
       ========================================== */
    .events-list {
      background-color: rgba(22, 22, 30, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
      width: 100%;
      box-sizing: border-box;
    }

    .events-list h3 {
      color: #ffffff;
      margin-bottom: 18px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.3px;
    }

    .event-item, .event-item-exam, .event-item-vacation {
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left-width: 4px;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .event-item { border-left-color: #a600cf; }
    .event-item-exam { border-left-color: #f19b06; }
    .event-item-vacation { border-left-color: #2ecc71; }

    .event-item-time {
      color: #64748b;
      font-size: 12px;
      margin-top: 6px;
      font-weight: 500;
    }

    #upcomingEvents {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .error-message, .success-message {
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 500;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .error-message {
      background-color: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }
    .success-message {
      background-color: rgba(166, 0, 207, 0.12);
      border-color: rgba(166, 0, 207, 0.25);
      color: #f472b6;
    }

    .install-btn {
      background: transparent !important;
      border: 1px solid rgba(255,255,255,0.15) !important;
      color: #94a3b8 !important;
      padding: 8px 14px !important;
      border-radius: 10px !important;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .install-btn:hover {
      border-color: rgba(166, 0, 207, 0.5) !important;
      color: #fff !important;
      background: rgba(166, 0, 207, 0.1) !important;
    }

    /* ==========================================
       6. MOBILE OPTIMIZATION RESPONSES
       ========================================== */
    @media (max-width: 768px) {
      .login-card { padding: 30px 20px; }
      .header { justify-content: center; }
      .fc-col-header-cell { font-size: 0.75em; }
      .fc-daygrid-day-number { font-size: 0.85em; }
    }

    @media (max-width: 600px) {
      .main-home-link {
        top: auto;
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        padding: 7px 12px;
        font-size: 13px;
      }
      .calendar-container { padding: 12px; min-height: auto; }
      .header { flex-direction: column; align-items: stretch; gap: 8px; }
      .header h1 { font-size: 1.25rem; margin-bottom: 0; }
      #userSection { width: 100%; display: flex; justify-content: space-between; align-items: center; }
      #calendar { padding: 8px; border-radius: 12px; min-height: 480px; }
      .events-list {
        margin-top: 16px;
        width: 100%;
        max-height: none;
        padding: 12px;
      }
      .fc .fc-button, .fc .fc-button-primary { padding: 8px 10px; font-size: 0.9rem; border-radius: 8px; }
      .fc .fc-col-header-cell { font-size: 0.72em; }
      .login-card { padding: 20px; width: 92vw; }
      .login-btn, .logout-btn { padding: 12px 18px; border-radius: 12px; font-size: 15px; }
      
      .event-modal { max-width: 95vw !important; width: 95vw !important; padding: 18px !important; border-radius: 12px !important; }
      .event-modal-buttons { flex-direction: column !important; }
      .event-modal-buttons button { width: 100% !important; margin-bottom: 8px; }

      .fc .fc-toolbar { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
      .fc .fc-toolbar-chunk { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
      .fc .fc-toolbar-chunk:nth-child(1) { order: 1; }
      .fc .fc-toolbar-chunk:nth-child(2) { order: 2; }
      .fc .fc-toolbar-chunk:nth-child(3) { order: 3; }
      .fc .fc-toolbar .fc-toolbar-chunk .fc-toolbar-title { font-size: 1.15rem; text-align: left; flex: 1; }
      .fc .fc-toolbar-chunk:nth-child(3) { justify-content: flex-end; }
      .fc .fc-button-group, .fc .fc-button { flex-wrap: wrap; }
    }
  </style>
</head>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>📚 Study Calendar</h2>
      <p>Sign in to access your dashboard</p>
      <div style="display: grid; gap: 12px; min-width: 280px;">

        <input id="passwordInput" type="password" placeholder="Password" class="login-field">
        <div id="loginErrorMessage" style="display: none; padding: 10px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fecaca; font-size: 14px;"></div>
        <button id="loginBtn" class="login-btn">Login</button>

  <div id="calendarScreen" style="display: none;">
    <div class="calendar-container">
      <div class="header">
        <h1>📚 Study Calendar</h1>
        <div id="userSection" style="display: flex; gap: 15px; align-items: center;">
          <button id="installBtn" class="install-btn" style="display: none;">
            📲 Install App
          </button>
          <div id="userInfo" class="user-info">
            <span id="userName" class="user-name"></span>
          </div>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>

      <div id="messageContainer"></div>

      <div id="calendar"></div>

      <div id="eventsList" class="events-list">
        <h3>📅 Upcoming Events</h3>
        <div id="upcomingEvents">
          <p style="color: #808080;">Loading events...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <script>
    // Configuration
    const defaultApiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:5050/api'
      : '/api';

    const CONFIG = {
      API_BASE_URL: localStorage.getItem('calendarApiBase') || defaultApiBase
    };

    // Global variables
    let calendar;
    let accessToken = null;
    let userProfile = null;
    let selectedEvent = null;
    let selectedDateRange = null;
    let formOpenTime = 0;
    let loggedIn = false;

    function setStoredAuth(token) {
      accessToken = token;
      localStorage.setItem('calendarAuthToken', token);
    }

    function clearStoredAuth() {
      accessToken = null;
      localStorage.removeItem('calendarAuthToken');
    }

    function getStoredAccessToken() {
      const token = localStorage.getItem('calendarAuthToken');
      if (token) {
        accessToken = token;
        return true;
      }
      return false;
    }

    async function apiFetch(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };

      if (accessToken) {
        headers['Authorization'] = `Bearer ${accessToken}`;
      }

      const response = await fetch(`${CONFIG.API_BASE_URL}${path}`, {
        ...options,
        headers
      });

      if (response.status === 401) {
        clearStoredAuth();
        if (loggedIn) {
          showMessage('Session expired. Please login again.', 'error');
          logout();
        }
      }

      return response;
    }

    async function parseResponseJsonSafe(response) {
      const rawText = await response.text();
      if (!rawText) {
        return {};
      }

      try {
        return JSON.parse(rawText);
      } catch {
        return {
          error: `Unexpected non-JSON response (HTTP ${response.status})`,
          raw: rawText
        };
      }
    }

    async function checkExistingAuth() {
      if (!getStoredAccessToken()) {
        return;
      }

      const success = await fetchUserProfile();
      if (success) {
        await loginUser();
      } else {
        clearStoredAuth();
      }
    }

    async function fetchUserProfile() {
      try {
        if (!accessToken) {
          throw new Error('No auth token available');
        }

        const response = await apiFetch('/auth/me', { method: 'GET' });
        if (!response.ok) {
          throw new Error(`Failed to fetch user profile: ${response.status}`);
        }

        const data = await parseResponseJsonSafe(response);
        userProfile = data.user || null;
        updateUserInfo();
        return true;
      } catch (error) {
        console.error('Error fetching user profile:', error);
        return false;
      }
    }

    function updateUserInfo() {
      const userNameEl = document.getElementById('userName');
      if (!userNameEl) {
        return;
      }

      if (userProfile) {
        userNameEl.textContent = userProfile.username;
      } else {
        userNameEl.textContent = 'Unknown user';
      }
    }

    async function loginWithPassword(username, password) {
      const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await parseResponseJsonSafe(response);
      if (!response.ok || !data.token) {
        throw new Error(data.error || 'Invalid username or password');
      }

      setStoredAuth(data.token);
      userProfile = data.user || null;
      updateUserInfo();
      return true;
    }

    // Fetch all-day events from local API
    async function fetchCalendarEvents() {
      try {
        const normalizeApiDate = (value) => {
          if (!value) return '';
          if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
            return value;
          }
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) {
            return '';
          }
          return d.toISOString().slice(0, 10);
        };

        const response = await apiFetch('/events', {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error('Failed to fetch events');
        }

        const data = await parseResponseJsonSafe(response);
        return (data.events || []).map(event => ({
          id: String(event.event_id),
          summary: event.title,
          start: { date: normalizeApiDate(event.start_date) },
          end: { date: normalizeApiDate(event.end_date) },
          description: event.description,
          colorHex: event.color_hex
        }));
      } catch (error) {
        console.error('Error fetching events:', error);
        showMessage('Failed to fetch calendar events', 'error');
        return [];
      }
    }

    async function createEvent(title, startDate, endDate) {
      return createEventAllDay(title, startDate, endDate);
    }

    async function createEventAllDay(title, startDate, endDate) {
      try {
        if (!title) throw new Error('Event title is required');
        if (!startDate) throw new Error('Start date is required');
        if (!endDate) endDate = startDate;

        const response = await apiFetch('/events', {
          method: 'POST',
          body: JSON.stringify({
            title,
            start_date: startDate,
            end_date: endDate,
            description: 'Created via Study Calendar',
            color_hex: '#a600cf'
          })
        });

        const data = await parseResponseJsonSafe(response);
        if (!response.ok) {
          throw new Error(data.error || 'Failed to create event');
        }

        showMessage('Event created successfully!', 'success');
        await refreshCalendar();
        return data;
      } catch (error) {
        console.error('Error creating event:', error);
        showMessage('Failed to create event: ' + error.message, 'error');
        return null;
      }
    }

    async function updateEvent(eventId, updatedData) {
      try {
        const title = updatedData?.summary || 'Untitled';
        const startDate = updatedData?.start?.date;
        const endDate = updatedData?.end?.date || startDate;

        const response = await apiFetch(`/events/${eventId}`, {
          method: 'PUT',
          body: JSON.stringify({
            title,
            start_date: startDate,
            end_date: endDate,
            description: updatedData?.description || null,
            color_hex: '#a600cf'
          })
        });

        const data = await parseResponseJsonSafe(response);
        if (!response.ok) {
          throw new Error(data.error || 'Failed to update event');
        }

        showMessage('Event updated successfully!', 'success');
        await refreshCalendar();
        return true;
      } catch (error) {
        console.error('Error updating event:', error);
        showMessage('Failed to update event: ' + error.message, 'error');
        return false;
      }
    }

    async function deleteEventWithoutConfirm(eventId) {
      try {
        const response = await apiFetch(`/events/${eventId}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const data = await parseResponseJsonSafe(response);
          throw new Error(data.error || 'Failed to delete event');
        }

        showMessage('Event deleted successfully!', 'success');
        await refreshCalendar();
        return true;
      } catch (error) {
        console.error('Error deleting event:', error);
        showMessage('Failed to delete event: ' + error.message, 'error');
        return false;
      }
    }

    async function deleteEvent(eventId) {
      try {
        if (!confirm('Are you sure you want to delete this event?')) return false;
        return deleteEventWithoutConfirm(eventId);
      } catch (error) {
        console.error('Error deleting event:', error);
        showMessage('Failed to delete event: ' + error.message, 'error');
        return false;
      }
    }

    async function refreshCalendar() {
      if (calendar) {
        calendar.destroy();
      }
      await initializeCalendar();
    }

    async function initializeCalendar() {
      try {
        console.log('=== Starting calendar initialization ===');
        const calendarEl = document.getElementById('calendar');
        
        if (!calendarEl) {
          showMessage('Calendar element not found', 'error');
          return;
        }

        const events = await fetchCalendarEvents();

        const addOneDayIso = (dateValue) => {
          if (!dateValue) return dateValue;
          const d = /^\d{4}-\d{2}-\d{2}$/.test(dateValue)
            ? new Date(dateValue + 'T00:00:00')
            : new Date(dateValue);
          if (Number.isNaN(d.getTime())) {
            return '';
          }
          d.setDate(d.getDate() + 1);
          return d.toISOString().slice(0, 10);
        };
        
        const formattedEvents = events.map(event => {
          const summaryText = (event.summary || '').toLowerCase();
          const isExam = summaryText.includes('prüfung') || summaryText.includes('pruefung');
          const isVacation = summaryText.includes('ferien');
          
          // Re-balanced contextual transparency loops to blend smoothly over our purple ecosystem
          const eventColor = isVacation ? 'rgba(46, 204, 113, 0.2)' : (isExam ? 'rgba(241, 155, 6, 0.2)' : 'rgba(166, 0, 207, 0.2)');
          const borderCtx = isVacation ? '#2ecc71' : (isExam ? '#f19b06' : '#a600cf');

          return {
            id: event.id,
            title: event.summary || 'No title',
            start: event.start.dateTime || event.start.date,
            end: event.end.dateTime || addOneDayIso(event.end.date),
            backgroundColor: eventColor,
            borderColor: borderCtx,
            extendedProps: {
              dbEventId: event.id,
              description: event.description,
              location: event.location
            }
          };
        });

        if (calendar) {
          calendar.destroy();
          calendar = null;
        }
        
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          firstDay: 1,
          headerToolbar: {
            left: 'prev,next today addEventBtn',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          customButtons: {
            addEventBtn: {
              text: '+ Add Event',
              click: function() {
                showEventForm();
              }
            }
          },
          height: 'auto',
          contentHeight: 'auto',
          selectable: true,
          select: function(info) {
            selectedDateRange = {
              start: info.start,
              end: info.end
            };
            showEventForm();
          },
          dateClick: function(info) {
            try {
              selectedDateRange = { start: info.date, end: info.date };
              showEventForm();
            } catch (e) {
              console.error('dateClick handler error:', e);
            }
          },
          eventClick: function(info) {
            handleEventClick(info);
          },
          events: formattedEvents
        });

        calendar.render();
        displayUpcomingEvents(events);
      } catch (error) {
        console.error('ERROR in initializeCalendar:', error);
        showMessage('Failed to initialize calendar: ' + error.message, 'error');
      }
    }

    function displayUpcomingEvents(events) {
      const upcomingContainer = document.getElementById('upcomingEvents');
      const now = new Date();
      
      const upcomingEvents = events
        .filter(event => new Date(event.start.dateTime || event.start.date) > now)
        .sort((a, b) => new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date))
        .slice(0, 10);

      if (upcomingEvents.length === 0) {
        upcomingContainer.innerHTML = '<p style="color: #64748b; font-weight: 500;">No upcoming events inside registry.</p>';
        return;
      }

      upcomingContainer.innerHTML = upcomingEvents.map(event => {
        const startTime = new Date(event.start.dateTime || event.start.date);
        const timeStr = event.start.dateTime 
          ? startTime.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          : startTime.toLocaleString('en-US', { month: 'short', day: 'numeric' });

        const isExam = event.summary.toLowerCase().includes("prüfung") || event.summary.toLowerCase().includes("pruefung");
        const isVacation = event.summary.toLowerCase().includes("ferien");

        if (isExam) {
          return `
            <div class="event-item-exam">
              <strong>${event.summary || 'No title'}</strong>
              <div class="event-item-time">${timeStr}</div>
            </div>
          `;
        } else if (isVacation) {
          return `
            <div class="event-item-vacation">
              <strong>${event.summary || 'No title'}</strong>
              <div class="event-item-time">${timeStr}</div>
            </div>
          `;
        } else {
          return `
            <div class="event-item">
              <strong>${event.summary || 'No title'}</strong>
              <div class="event-item-time">${timeStr}</div>
            </div>
          `;
        }
      }).join('');
    }

    function handleEventClick(info) {
      const event = info.event;
      selectedEvent = event;
      showEventForm(event);
    }

    function handleDateSelect(info) {
      selectedDateRange = {
        start: info.start,
        end: info.end
      };
      showEventForm();
    }

    function showEventForm(event = null) {
      const now = Date.now();
      if (now - formOpenTime < 100) {
        return;
      }
      formOpenTime = now;
      
      const title = event ? event.title : '';
      const dateToLocalYYYYMMDD = (d) => {
        if (!d) return '';
        const date = new Date(d);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };
      const getLocalDateString = () => dateToLocalYYYYMMDD(new Date());
      const subtractOneDay = (isoDate) => {
        if (!isoDate) return '';
        const d = new Date(isoDate + 'T00:00:00');
        d.setDate(d.getDate() - 1);
        return dateToLocalYYYYMMDD(d);
      };

      const startDate = event ? dateToLocalYYYYMMDD(event.start) : (selectedDateRange ? dateToLocalYYYYMMDD(selectedDateRange.start) : getLocalDateString());
      let endDate = startDate;
      if (event && event.end) {
        const ed = subtractOneDay(dateToLocalYYYYMMDD(event.end));
        endDate = ed || startDate;
      }

      const isMultiDay = event && event.end
        ? (dateToLocalYYYYMMDD(event.end) !== dateToLocalYYYYMMDD(event.start))
        : false;
      const isAllDay = true;

      const modal = document.createElement('div');
      modal.className = 'event-modal-overlay';
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      `;

      const form = document.createElement('div');
      form.className = 'event-modal';
      form.style.cssText = `
        background: #1e1e28;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        max-width: 480px;
        width: 90%;
        color: #ffffff;
      `;

      form.innerHTML = `
        <h3 style="margin-top: 0; color: #ffffff; font-weight: 700; margin-bottom: 20px;">${event ? 'Edit Event' : 'Create Event'}</h3>
        
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-weight: 500; font-size: 14px;">Event Title</label>
          <input type="text" id="eventTitle" value="${title}" placeholder="Enter event title" style="
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.25);
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
          ">
        </div>

        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="allDayCheckbox" checked disabled style="cursor: not-allowed; opacity: 0.6; accent-color: #a600cf;">
          <label for="allDayCheckbox" style="color: #94a3b8; cursor: default; margin: 0; font-size: 14px;">All-day event</label>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-weight: 500; font-size: 14px;">Start Date</label>
          <input type="date" id="eventStart" value="${startDate}" style="
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.25);
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
          ">
        </div>

        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="multiDayCheckbox" ${isMultiDay ? 'checked' : ''} style="cursor: pointer; accent-color: #a600cf;">
          <label for="multiDayCheckbox" style="color: #94a3b8; cursor: pointer; margin: 0; font-size: 14px;">Multiple days</label>
        </div>

        <div id="endDateContainer" style="margin-bottom: 20px; display: ${isMultiDay ? 'block' : 'none'};">
          <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-weight: 500; font-size: 14px;">End Date</label>
          <input type="date" id="eventEnd" value="${endDate}" style="
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.25);
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
          ">
        </div>

        <div class="event-modal-buttons" style="display: flex; gap: 10px;">
          <button id="saveEventBtn" style="
            flex: 1;
            padding: 11px;
            background: #a600cf;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
          ">Save Event</button>
          <button id="cancelBtn" style="
            flex: 1;
            padding: 11px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
          ">Cancel</button>
          ${event ? `<button id="deleteEventBtn" style="
            flex: 0.8;
            padding: 11px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
          ">Delete</button>` : ''}
        </div>
      `;

      modal.appendChild(form);
      document.body.appendChild(modal);

      const saveEventBtn = form.querySelector('#saveEventBtn');
      const cancelBtn = form.querySelector('#cancelBtn');
      const deleteBtn = form.querySelector('#deleteEventBtn');
      const multiDayCheckbox = form.querySelector('#multiDayCheckbox');
      const endDateContainer = form.querySelector('#endDateContainer');

      if (multiDayCheckbox) {
        multiDayCheckbox.addEventListener('change', () => {
          if (multiDayCheckbox.checked) {
            endDateContainer.style.display = 'block';
          } else {
            endDateContainer.style.display = 'none';
            const eventEnd = form.querySelector('#eventEnd');
            const eventStart = form.querySelector('#eventStart');
            if (eventEnd && eventStart) {
              eventEnd.value = eventStart.value;
            }
          }
        });
      }

      if (saveEventBtn) {
        saveEventBtn.addEventListener('click', async () => {
          try {
            const titleInput = form.querySelector('#eventTitle').value;
            const startDateInput = form.querySelector('#eventStart').value;
            let endDateInput = form.querySelector('#eventEnd').value;

            if (!titleInput || !startDateInput) {
              showMessage('Please fill in all fields', 'error');
              return;
            }

            if (!multiDayCheckbox.checked) {
              endDateInput = startDateInput;
            }

            if (!endDateInput) {
              showMessage('Please select an end date', 'error');
              return;
            }

            if (event) {
              const eventData = {
                summary: titleInput,
                start: { date: startDateInput },
                end: { date: endDateInput }
              };
              await updateEvent(event.id, eventData);
            } else {
              await createEventAllDay(titleInput, startDateInput, endDateInput);
            }

            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
            selectedDateRange = null;
            selectedEvent = null;
          } catch (e) {
            console.error('Error saving event:', e);
            showMessage('Error saving event: ' + e.message, 'error');
          }
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          try {
            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
            selectedDateRange = null;
            selectedEvent = null;
          } catch (e) {
            console.error('Error closing modal:', e);
            if (modal) modal.style.display = 'none';
          }
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (confirm('Are you sure you want to delete this event?')) {
            await deleteEventWithoutConfirm(event.id);
            if (modal && modal.parentNode) {
              modal.parentNode.removeChild(modal);
            }
          }
        });
      }
    }

    function handleDatesSet(info) {
      console.log('Calendar dates changed', info);
    }

    function showMessage(message, type = 'info') {
      const container = document.getElementById('messageContainer');
      const messageClass = type === 'error' ? 'error-message' : 'success-message';
      container.innerHTML = `<div class="${messageClass}">${message}</div>`;
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    async function loginUser() {
      try {
        loggedIn = true;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('calendarScreen').style.display = 'block';

        if (!await fetchUserProfile()) {
          showMessage('Failed to authenticate. Please log in again.', 'error');
          setTimeout(() => logout(), 2000);
          return;
        }

        await initializeCalendar();
        showMessage('Welcome! Your calendar is loaded.', 'success');
      } catch (error) {
        console.error('Login error:', error);
        showMessage('Login failed: ' + error.message, 'error');
        setTimeout(() => logout(), 2000);
      }
    }

    function logout() {
      clearStoredAuth();
      userProfile = null;
      loggedIn = false;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('calendarScreen').style.display = 'none';
      document.getElementById('messageContainer').innerHTML = '';
      if (calendar) calendar.destroy();

      showMessage('Logged out successfully.', 'success');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const loginBtn = document.getElementById('loginBtn');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginErrorMessage = document.getElementById('loginErrorMessage');

      function showLoginError(message) {
        if (loginErrorMessage) {
          loginErrorMessage.textContent = message;
          loginErrorMessage.style.display = 'block';
        }
      }

      function clearLoginError() {
        if (loginErrorMessage) {
          loginErrorMessage.style.display = 'none';
        }
      }

      usernameInput?.addEventListener('input', clearLoginError);
      passwordInput?.addEventListener('input', clearLoginError);

      if (loginBtn) {
        loginBtn.addEventListener('click', async () => {
          try {
            clearLoginError();
            const username = (usernameInput?.value || '').trim();
            const password = passwordInput?.value || '';

            if (!username || !password) {
              showLoginError('Please enter both username and password');
              return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            await loginWithPassword(username, password);
            await loginUser();
          } catch (error) {
            const errorMsg = error.message || 'Login failed. Please try again.';
            showLoginError(errorMsg);
          } finally {
            if (loginBtn) {
              loginBtn.disabled = false;
              loginBtn.textContent = 'Login';
            }
          }
        });
      }

      if (passwordInput) {
        passwordInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter') {
            loginBtn?.click();
          }
        });
      }

      await checkExistingAuth();
      document.getElementById('logoutBtn').addEventListener('click', logout);
      initializePWAInstall();
    });

    let deferredPrompt;
    function initializePWAInstall() {
      const installBtn = document.getElementById('installBtn');
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
        installBtn.addEventListener('click', installPWA);
      });

      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
        deferredPrompt = null;
      });

      if (window.matchMedia('(display-mode: standalone)').matches) {
        installBtn.style.display = 'none';
      }
    }

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install prompt: ${outcome}`);
        deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('Service Worker registered:', reg);
        }).catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
