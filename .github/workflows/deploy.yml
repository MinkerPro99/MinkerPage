name: Remote Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Execute Pull and Deploy Natively
        run: |
          # 1. Fetch from your repo using Plesk CLI commands
          sudo plesk ext git --fetch -domain minkerpage.ch -name "MinkerPage.git"
          
          # 2. Deploy the files to httpdocs
          sudo plesk ext git --deploy -domain minkerpage.ch -name "MinkerPage.git"
          
          # 3. Gracefully cycle the Python API layer
          sudo touch /var/www/vhosts/minkerpage.ch/httpdocs/tmp/restart.txt