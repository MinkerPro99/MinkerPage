<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <link rel="manifest" href="/calendar-manifest.json">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="description" content="A dark-themed study calendar with local account login and MySQL storage">
  <title>Study Calendar</title>

  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/study-calendar.css">
</head>

<body class="bg">
  <div class="color-circles"></div>

  <div class="bg-logo"><img src="/img/1kIcon.png" alt="" aria-hidden="true"></div>

  <a class="main-home-link" href="../main.html" aria-label="Return to main page">Main Page</a>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>📚 Study Calendar</h2>
      <p>Sign in to access your dashboard</p>
      <div style="display: grid; gap: 12px; min-width: 280px;">
        <input id="usernameInput" type="text" placeholder="Username" class="login-field">
        <input id="passwordInput" type="password" placeholder="Password" class="login-field">
        <div id="loginErrorMessage" style="display: none; padding: 10px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fecaca; font-size: 14px;"></div>
        <button id="loginBtn" class="login-btn">Login</button>
        <a href="./register.html" style="color: #a600cf; text-decoration: none; font-size: 14px; font-weight: 600;">Create account</a>
      </div>
    </div>
  </div>

  <div id="calendarScreen" style="display: none;">
    <div class="calendar-container">
      <div class="header">
        <h1>📚 Study Calendar</h1>
        <div id="userSection" style="display: flex; gap: 15px; align-items: center;">
          <button id="installBtn" class="install-btn" style="display: none;">
            <i class="bi bi-phone-fill" aria-hidden="true"></i>
            <span>Install App</span>
          </button>
          <div id="userInfo" class="user-info">
            <span id="userName" class="user-name"></span>
          </div>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>

      <div id="messageContainer"></div>

      <div id="calendar"></div>

      <div id="eventsList" class="events-list">
        <h3>📅 Upcoming Events</h3>
        <div id="upcomingEvents">
          <p style="color: #808080;">Loading events...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="../js/study-calendar.js"></script>
</body>

</html>
