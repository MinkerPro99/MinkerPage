<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <meta name="theme-color" content="#232329">
  <title>Register - Study Calendar</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/register.css">
</head>

<body>
  <div class="color-circles" aria-hidden="true"></div>
  <div class="bg-logo"><img src="/img/1kIcon.png" alt="" aria-hidden="true"></div>

  <div class="login-screen">
    <div class="login-card">
      <h2>Study Calendar</h2>
      <p>Create your account to start using the calendar</p>

      <div id="msg" class="msg"></div>

      <div class="auth-fields">
        <input id="username" class="login-field" type="text" placeholder="Username" minlength="3" />
        <input id="password" class="login-field" type="password" placeholder="Password (min 6 chars)" minlength="6" />
        <button id="registerBtn" class="login-btn">Register</button>
        <button id="forgotPasswordBtn" class="login-btn" type="button" style="background: transparent; border: 1px solid rgba(166, 0, 207, 0.5); color: #c4b5fd;">Forgot password?</button>
        <div class="hint">
          <a href="./studyCallendar.html">Back to login</a>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/register.js"></script>
</body>

</html>
