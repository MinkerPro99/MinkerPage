<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <script src="js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <title>MinkerPage</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg">
  <div class="color-circles"></div>

  <div class="bg-logo"><img src="/img/1kIcon.png" alt="" aria-hidden="true"></div>

  <div class="launcher-container">
    <div class="dark-card fade-in col-md-4 col-sm-10">
      <div class="row m-1">
        <h1 class="text-center w-txt fw-bold mb-3">Welcome</h1>

        <div class="quick-links col-12 mb-4">
          <button type="button" class="btn quick-link-btn quick-link-calendar" id="calendarBtn" aria-label="Open Calendar">
            <i class="bi bi-calendar-event-fill" aria-hidden="true"></i>
            <span>Open Calendar</span>
          </button>
          <button type="button" class="btn quick-link-btn quick-link-study-trainer" id="studyTrainerBtn" aria-label="Open Study Trainer">
            <i class="bi bi-mortarboard-fill" aria-hidden="true"></i>
            <span>Open Study Trainer</span>
          </button>
          <button type="button" class="btn quick-link-btn quick-link-smart-home" id="smartHomeBtn" aria-label="Open Smart Home">
            <i class="bi bi-house-gear-fill" aria-hidden="true"></i>
            <span>Open Smart Home</span>
          </button>
          <button type="button" class="btn quick-link-btn quick-link-vocab" id="vocabularyBtn" aria-label="Open Vocabulary">
            <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
            <span>Open Vocabulary</span>
          </button>
        </div>

        <h3 class="text-center w-txt fs-5 mt-4">Enter your Key:</h3>

        <div class="d-flex flex-column gap-2 w-100 mt-2 mb-1">
          <input class="auth-zone-input" id="connectString" type="text" placeholder="Access Token...">

          <button class="connect-execute-btn" id="connectBtn">Connect System</button>

          <button class="btn install-action-btn" id="install_button" hidden>Install Application</button>
        </div>

        <p class="p-2 text-center alert-msg status-error mt-2 mb-0" id="invalidKeyMessage" hidden>Ã¢Å¡Â Ã¯Â¸Â Invalid Key!</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/main.js"></script>

  <footer class="site-footer">
    <a href="pages/privacy.html">Privacy Policy</a>
    <a href="pages/terms.html">Terms of Use</a>
  </footer>
</body>

</html>
