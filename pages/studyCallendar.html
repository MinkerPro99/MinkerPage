<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/img/1kIcon.png">
  <link rel="manifest" href="/calendar-manifest.json">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="description" content="A dark-themed study calendar with local account login and MySQL storage">
  <title>Study Calendar</title>

  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/study-calendar.css">
</head>

<body class="bg">
  <div class="color-circles"></div>

  <div class="bg-logo"><img src="/img/1kIcon.png" alt="" aria-hidden="true"></div>

  <a class="main-home-link" href="../main.html" aria-label="Return to main page">Main Page</a>

  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>📚 Study Calendar</h2>
      <p>Sign in to access your dashboard</p>
      <div style="display: grid; gap: 12px; min-width: 280px;">
        <input id="usernameInput" type="text" placeholder="Username" class="login-field">
        <input id="passwordInput" type="password" placeholder="Password" class="login-field">
        <div id="loginErrorMessage" style="display: none; padding: 10px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fecaca; font-size: 14px;"></div>
        <button id="loginBtn" class="login-btn">Login</button>
        <button id="forgotPasswordBtn" class="login-btn" type="button" style="background: transparent; border: 1px solid rgba(166, 0, 207, 0.5); color: #c4b5fd;">Forgot password?</button>
        <a href="./register.html" style="color: #a600cf; text-decoration: none; font-size: 14px; font-weight: 600;">Create account</a>
      </div>
    </div>
  </div>

  <div id="calendarScreen" style="display: none;">
    <div class="calendar-container">
      <div class="header">
        <h1>📚 Study Calendar</h1>
        <div id="userSection" style="display: flex; gap: 15px; align-items: center;">
          <button id="installBtn" class="install-btn" style="display: none;">
            <i class="bi bi-phone-fill" aria-hidden="true"></i>
            <span>Install App</span>
          </button>
          <button id="settingsBtn" class="user-info account-settings-trigger" type="button" title="Settings" aria-label="Open account settings">
            <span id="userName" class="user-name"></span>
            <svg class="settings-cog" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98L14.5 2.42A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42L9.12 5.07c-.61.24-1.18.56-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.02.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.62.22l2.47-1c.51.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.24 1.18-.56 1.69-.98l2.47 1c.23.09.49 0 .62-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z" />
            </svg>
          </button>
          <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
      </div>

      <div id="messageContainer"></div>

      <div id="calendar"></div>

      <div id="eventsList" class="events-list">
        <h3>📅 Upcoming Events</h3>
        <div id="upcomingEvents">
          <p style="color: #808080;">Loading events...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="../js/study-calendar.js"></script>
</body>

</html>
